<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServXpert | Dashboard</title>
    <link rel="stylesheet" href="../css/user-dashboard.css">
    <link rel="stylesheet" href="../css/toast.css">
</head>
<body>

<header class="header">

    <div class="nav-container">

        <!-- LEFT SIDE -->
        <div class="nav-left">

            <img src="../logo.png"
                 alt="ServXpert Logo"
                 class="nav-logo">

            <div class="nav-title-group">

                <span class="nav-title">
                    User Dashboard
                </span>

                <span class="nav-subtitle">
                    ServXpert Support Center
                </span>

            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="nav-right">

            <div class="user-profile">

                <div class="profile-icon">
                    P
                </div>

                <div class="profile-info">

                    <span class="profile-name"
                          id="userNameDisplay">
                        Profile
                    </span>

                    <span class="profile-role">
                        Customer
                    </span>

                </div>

            </div>


            <button class="logout-btn"
                    onclick="logout()">

                Logout

            </button>

        </div>

    </div>

</header>

<main class="container">

    <section class="card">
        <h3>Create Ticket</h3>
        <form id="ticketForm" onsubmit="event.preventDefault(); createTicket();">
            <input type="text" id="title" placeholder="Ticket Title" required>
            <textarea id="description" placeholder="Describe your issue" required></textarea>
            
            <div class="form-row">
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="1">Technical</option>
                    <option value="2">Billing</option>
                    <option value="3">General</option>
                </select>

                <select id="priority" required>
                    <option value="">Select Priority</option>
                    <option value="1">Low</option>
                    <option value="2">Medium</option>
                    <option value="3">High</option>
                </select>
            </div>

            <button type="submit">Create Ticket</button>
        </form>
    </section>

    <section class="card">
        <h3>My Tickets</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Status</th>
                        <th>Assigned To</th>
                    </tr>
                </thead>
                <tbody id="ticketTableBody">
                    </tbody>
            </table>
        </div>
    </section>

</main>

<script src="../js/user.js"></script>
<script src="../js/toast.js"></script>


</body>
</html>
